[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telenotify-python"
version = "0.1.0"
description = "Official Python client for Telenotify: Telegram-first customer notifications and phone verification"
readme = "README.md"
authors = [
    { name = "sami-yesha" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["telenotify", "telegram", "sms", "notifications", "otp", "verification", "ethiopia"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://telenotify.duckdns.org"
Documentation = "https://telenotify.duckdns.org/docs"
Repository = "https://github.com/sami-yesha/telenotify"

[tool.setuptools.packages.find]
include = ["telenotify*"]

[tool.setuptools.package-data]
telenotify = ["py.typed"]
